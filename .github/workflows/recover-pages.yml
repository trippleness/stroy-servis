name: Recover stuck Pages deployment

on:
  push:
    paths:
      - .github/workflows/recover-pages.yml
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/pages/deployments/5c1a34898f6650d5516b589a3599b571a768e9d5/cancel"
